services:
  postgres:
    image: postgres:17-alpine
    container_name: ariadne-postgres
    environment:
      POSTGRES_DB: ariadne_db
      POSTGRES_USER: ariadne_user
      POSTGRES_PASSWORD: ariadne_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariadne_user -d ariadne_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
